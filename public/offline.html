
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101014" />
  <title>Questlog - Offline</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101014;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 420px;
    }

    h1 {
      color: #a78bfa;
      font-size: 32px;
    }

    p {
      color: #92919f;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 13px 24px;
      border: 0;
      border-radius: 10px;
      background: #a78bfa;
      color: #101014;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Questlog can't reach the network right now. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry connection</button>
  </main>
</body>
</html>
